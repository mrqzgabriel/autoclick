org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# compila o Kotlin dentro do próprio Gradle (sem daemon separado): menos RAM
# no servidor que faz o build do APK
kotlin.compiler.execution.strategy=in-process

# ---- AutoClick ----
# Nome da versão que aparece no app e no painel.
autoclick.versionName=2.1
# Número interno (versionCode) publicado pros celulares. TRAVADO aqui de
# propósito (14/09/2026): o EasyPanel não guarda o cache do Docker, então todo
# deploy do servidor recompilava o APK com um número novo e os 60 celulares
# baixavam e pediam toque pra instalar a MESMA versão. Com o número fixo, quem
# já tem fica em paz. Mudou algo em app/ e quer que os celulares atualizem?
# Suba este número (tem que ser maior que o instalado) junto com a mudança.
# Vazio = volta ao antigo: segundos desde 2023-11-14 a cada build.
autoclick.versionCode=89084212
# Endereço público do servidor (EasyPanel). Fica gravado dentro do APK: um
# celular novo já sabe onde sincronizar. Pode ser sobrescrito pela variável
# SERVER_URL do EasyPanel na hora do build.
autoclick.serverUrl=https://allwin-autoclick.feyjc1.easypanel.host
# Token que o app manda em cada pedido e o servidor confere. Vazio = sem token.
autoclick.syncToken=
