org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# compila o Kotlin dentro do próprio Gradle (sem daemon separado): menos RAM
# no servidor que faz o build do APK
kotlin.compiler.execution.strategy=in-process

# ---- AutoClick ----
# Nome da versão que aparece no app e no painel. O número interno
# (versionCode) é gerado sozinho a cada build, não precisa mexer.
autoclick.versionName=2.0
# Endereço público do servidor (EasyPanel). Fica gravado dentro do APK: um
# celular novo já sabe onde sincronizar. Pode ser sobrescrito pela variável
# SERVER_URL do EasyPanel na hora do build.
autoclick.serverUrl=https://allwin-autoclick.feyjc1.easypanel.host
# Token que o app manda em cada pedido e o servidor confere. Vazio = sem token.
autoclick.syncToken=
